name: ui

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # The accessibility gate: axe-core over every Studio view and every hard surface, in both colour
  # schemes (ticket 18 — "in CI on every run"), plus the keyboard suite for the half a scan cannot
  # see — whether a declared role behaves the way it promises. Its own job rather than a step on
  # `build`, so a contrast regression is attributable at a glance and does not read as a unit-test
  # failure.
  #
  # Scoped to this suite rather than adopting all of `e2e/` as a merge gate: that suite drives the
  # .NET host, so it needs a second toolchain here and a running backend to stay green, and making
  # it required is a decision in its own right that nothing has asked for. This one serves a static
  # build with a stubbed API (`e2e-a11y/stubs.ts`), so it needs neither.
  accessibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The studio's bundle imports the packages by their published entry points, so they have to
      # exist before it can be built at all.
      - run: pnpm -r build
      - run: pnpm --filter @motiv-rules/studio exec playwright install --with-deps chromium
      - run: pnpm --filter @motiv-rules/studio a11y

  # Ticket 17's non-React story, made mechanical: `@motiv-rules/core` is packed the way a publish
  # would pack it, extracted into a scratch tree where nothing else is installed, and driven from
  # plain Node with `react` asserted to be unresolvable.
  #
  # Its own job because what it proves is a property of the *artefact*, which `build` structurally
  # cannot see: inside this workspace React is one `node_modules` away from every file, so an
  # accidental import would resolve, typecheck and pass its tests. This also exercises the `files`
  # field and the exports map, whose first honest reader is otherwise a consumer.
  framework-free:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motiv-rules/core build
      - run: pnpm --filter @motiv-rules/core verify:isolated
