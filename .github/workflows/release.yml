# Release: triggered by pushing a v* tag (e.g. v9.0.0).
# The tag is the single source of truth for the version (derived via MinVer).
# Steps: test the tagged commit, pack, push to NuGet, create a GitHub Release.
#
# Scope: this tag prefix releases Motiv only. Motiv.Serialization,
# Motiv.Serialization.AspNetCore, Motiv.Analyzer and Motiv.CodeFix are deliberately
# unpublished — they are on their own maturity curve and are due a series of
# intentional breaking changes (a rule store, an async publish path, a refresh
# contract). Publishing them on this prefix would both number a first release after
# Motiv's majors and force Motiv's major every time the rules stack breaks. They get
# their own MinVerTagPrefix and their own 0.x line before they ship.
#
# Every project sets GeneratePackageOnBuild, so a Release build leaves .nupkg files in
# each project's bin/. That is harmless here only because the push below is scoped to
# ./nupkgs — keep it that way, or unpublished packages will ship by accident.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
    - name: Checkout (full history for MinVer)
      uses: actions/checkout@v5
      with:
        fetch-depth: 0   # MinVer needs full history + tags to derive the version

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Test (release gate)
      run: dotnet test --configuration Release --verbosity normal

    - name: Pack (version stamped from the tag by MinVer)
      run: |
        dotnet pack src/Motiv/Motiv.csproj --configuration Release --output ./nupkgs

    - name: List NuGet Packages
      run: Get-ChildItem -Path .\nupkgs\ -Recurse -Name

    - name: Push to NuGet (pushes .nupkg and adjacent .snupkg)
      run: dotnet nuget push "nupkgs/**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        # Mark hyphenated SemVer tags (e.g. v8.0.0-rc.1, -beta, -alpha) as a GitHub
        # prerelease; a plain tag like v8.0.0 stays a full "Latest" release.
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          nupkgs/*.nupkg
          nupkgs/*.snupkg
