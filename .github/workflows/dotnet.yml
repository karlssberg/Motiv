# Continuous integration: build and test on every PR and push to main.
# Publishing to NuGet is handled separately by release.yml (triggered by v* tags).

name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    # --verbosity minimal, not normal: at normal this step emits the full csc command line for every
    # project and target framework, which is hundreds of kilobytes before a single test has run.
    # GitHub only serves the tail of a job log, so a failure early in the run is pushed out of the
    # window and cannot be read at all — a log nobody can reach the failure in is not a log. Failed
    # test names, their messages and the per-project summaries all still print at minimal.
    - name: Test
      run: dotnet test --configuration Release --verbosity minimal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
    - name: Pack (validation only — not published)
      run: |
        dotnet pack src/Motiv/Motiv.csproj --configuration Release --output ./nupkgs
        dotnet pack src/Motiv.Serialization/Motiv.Serialization.csproj --configuration Release --output ./nupkgs
    - name: List NuGet Packages
      run: Get-ChildItem -Path .\nupkgs\ -Recurse -Name
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
