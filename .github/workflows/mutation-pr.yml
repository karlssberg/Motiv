# Mutation testing PR gate (#294, rollout step 3): mutates only the src/Motiv C# files a pull
# request changes, and checks each of them on its own (scripts/mutation/gate.sh): a file fails when it
# scores below its area's baseline, unless it already sat below that baseline and has gained no
# undetected mutants. The full, report-only run stays in mutation.yml; a full run is
# ~150 runner-minutes, this one scales with the diff.
#
# Scope is worked out from git by scripts/mutation/pr-scope.sh and passed to Stryker as --mutate
# globs, rather than with Stryker's own --since. In Stryker.NET 5.0.0 --since marks every mutant as
# changed when any non-.cs file under the test project changes (Motiv.Tests.csproj,
# stryker-config.json, the embedded DescriptionBaseline.txt), and every mutant a changed test file
# covers — repo-wide — when a test .cs file changes. Either turns a PR into a full run.
# See docs/contributing/mutation-testing.md, "PR gate".
#
# Stryker itself never breaks here: stryker-config.json keeps `break: 0`, as the full run needs, and
# the verdict is gate.sh's, from the report Stryker writes.

name: Mutation gate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/Motiv/**"
      - "test/Motiv.Tests/**"
      - ".config/dotnet-tools.json"
      - "scripts/mutation/**"
      - ".github/workflows/mutation-pr.yml"

permissions:
  contents: read

concurrency:
  group: mutation-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: motiv (changed files)
    runs-on: ubuntu-latest
    # Scales with the diff, but a refactor touching many files is still a long run.
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
      with:
        # The pull_request checkout is the merge commit; its first parent is the main it merges
        # into, so HEAD^1..HEAD is exactly what the PR changes.
        fetch-depth: 2
    - name: Work out scope
      id: scope
      run: |
        if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
          echo "::error::Expected the pull request merge commit at HEAD; cannot tell what the PR changed."
          exit 1
        fi
        scripts/mutation/pr-scope.sh HEAD^1 HEAD > "$RUNNER_TEMP/scope.json"
        cat "$RUNNER_TEMP/scope.json"
        {
          echo "count=$(jq '.files | length' "$RUNNER_TEMP/scope.json")"
          # Every later step keys on this; it is unset when this step fails, so they skip then too.
          echo "run=$(jq '.files | length > 0' "$RUNNER_TEMP/scope.json")"
        } >> "$GITHUB_OUTPUT"
    - name: Nothing to mutate
      if: steps.scope.outputs.run == 'false'
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ## Mutation gate — changed files in src/Motiv

        No `src/Motiv` C# file changed, so there is nothing to mutate and the gate does not apply.
        A change to tests alone is measured by the full run (`mutation.yml`), not here.
        EOF
    - name: Setup .NET
      if: steps.scope.outputs.run == 'true'
      uses: actions/setup-dotnet@v5
      with:
        # As in mutation.yml: 10.0 is the mutated framework and Stryker.NET 5's runtime; 8.0 and 9.0
        # because Motiv.Tests restores for every framework it targets.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore tools
      if: steps.scope.outputs.run == 'true'
      run: dotnet tool restore
    - name: Run Stryker.NET
      if: steps.scope.outputs.run == 'true'
      working-directory: test/Motiv.Tests
      env:
        # Caps every .NET process this step starts, test hosts included, at 3 GiB of GC heap. A mutant
        # that makes a deep-chain test allocate without bound then fails that test with an
        # OutOfMemoryException (the mutant is killed) instead of exhausting the runner, which ends the
        # job with "The runner has received a shutdown signal" and no report (#294). Hexadecimal, as the
        # environment-variable form of System.GC.HeapHardLimit requires.
        DOTNET_GCHeapHardLimit: "0xC0000000"
      run: |
        # Read into an array so the shell never expands the globs itself.
        mapfile -t globs < <(jq -r '.globs[]' "$RUNNER_TEMP/scope.json")
        mutate=()
        for glob in "${globs[@]}"; do mutate+=(--mutate "$glob"); done
        # Stryker refuses an --output directory that does not already exist.
        mkdir -p "$RUNNER_TEMP/stryker"
        # With break 0 any non-zero exit is a failed run, not a verdict; the next step gives that.
        status=0
        dotnet tool run dotnet-stryker --output "$RUNNER_TEMP/stryker" "${mutate[@]}" || status=$?
        # Stryker also exits 0 when it finds no test project, without writing a report; that is not
        # a pass.
        if [ "$status" -eq 0 ] && [ ! -f "$RUNNER_TEMP/stryker/reports/mutation-report.json" ]; then
          echo "::error::Stryker exited 0 but wrote no mutation report."
          exit 1
        fi
        exit "$status"
    - name: Check each file
      if: steps.scope.outputs.run == 'true'
      run: |
        report="$RUNNER_TEMP/stryker/reports/mutation-report.json"
        # gate.sh writes to a file, not a pipe, so its exit status is kept for the verdict below.
        status=0
        scripts/mutation/gate.sh "$RUNNER_TEMP/scope.json" "$report" > "$RUNNER_TEMP/gate.md" || status=$?
        {
          scripts/mutation/summarise.sh "Mutation gate — changed files in src/Motiv" "$report"
          printf '\n'
          cat "$RUNNER_TEMP/gate.md"
          printf '\n\nArea baselines: %s\n' \
            "$(jq -r '[.areas[] | "\(.name) \(.baseline)%"] | join(", ")' "$RUNNER_TEMP/scope.json")"
        } | tee -a "$GITHUB_STEP_SUMMARY" || true
        if [ "$status" -ne 0 ]; then
          echo "::error::A changed file is below its mutation threshold; see the table above and the undetected mutants below."
        fi
        exit "$status"
    - name: List undetected mutants
      if: always() && steps.scope.outputs.run == 'true'
      # --details prints the list to the log as well as the summary, so triage does not depend on
      # downloading the artifact.
      run: >-
        scripts/mutation/survivors.sh --details "$RUNNER_TEMP/stryker/reports/mutation-report.json"
        >> "$GITHUB_STEP_SUMMARY"
    - name: Upload reports
      if: always() && steps.scope.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report-motiv-pr
        path: ${{ runner.temp }}/stryker
        if-no-files-found: warn
