# Mutation testing, report-only (#294, rollout step 1): Stryker.NET mutates src/Motiv and runs
# test/Motiv.Tests against every mutant. Nothing here fails on a low score — `thresholds.break`
# in test/Motiv.Tests/stryker-config.json is 0 until the baseline has been triaged.
#
# Sharded by directory (test/Motiv.Tests/stryker-shards.json): a single job ran for 2.5 hours and
# then lost its runner, and since Stryker writes its reports only at the end, it left nothing behind.
# Each shard publishes its own report, so a lost shard costs that shard alone; `combine` scores the
# union and names any shard that did not report.
#
# Not on every PR: a full run is far slower than the test suite it drives. It runs on demand, and on
# a PR only when the mutation setup itself changes, so a change to the config proves itself.

name: Mutation testing

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".config/dotnet-tools.json"
      - "test/Motiv.Tests/stryker-config.json"
      - "test/Motiv.Tests/stryker-shards.json"
      - "scripts/mutation/**"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v5
    - id: plan
      run: echo "matrix=$(scripts/mutation/plan-shards.sh)" >> "$GITHUB_OUTPUT"

  motiv:
    needs: plan
    name: motiv (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # 10.0 is both the mutated target framework and the runtime Stryker.NET 5 requires; 8.0 and
        # 9.0 because Motiv.Tests restores for every framework it targets.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore tools
      run: dotnet tool restore
    - name: Run Stryker.NET
      working-directory: test/Motiv.Tests
      env:
        GLOBS: ${{ toJSON(matrix.globs) }}
      run: |
        # Read into an array so the shell never expands the globs itself.
        mapfile -t globs < <(jq -r '.[]' <<< "$GLOBS")
        mutate=()
        for glob in "${globs[@]}"; do mutate+=(--mutate "$glob"); done
        # Stryker refuses an --output directory that does not already exist.
        mkdir -p "$RUNNER_TEMP/stryker"
        dotnet tool run dotnet-stryker --output "$RUNNER_TEMP/stryker" "${mutate[@]}"
    - name: Summarise score
      if: always()
      run: |
        title="Mutation score — src/Motiv (${{ matrix.name }})"
        report="$RUNNER_TEMP/stryker/reports/mutation-report.json"
        if [ -f "$report" ]; then
          scripts/mutation/summarise.sh "$title" "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          scripts/mutation/summarise.sh "$title" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report-motiv-${{ matrix.name }}
        path: ${{ runner.temp }}/stryker
        if-no-files-found: warn

  combine:
    needs: [ plan, motiv ]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        pattern: mutation-report-motiv-*
        path: reports
    - name: Summarise score
      env:
        MATRIX: ${{ needs.plan.outputs.matrix }}
      run: |
        reports=()
        missing=()
        for shard in $(jq -r '.include[].name' <<< "$MATRIX"); do
          report="reports/mutation-report-motiv-$shard/reports/mutation-report.json"
          if [ -f "$report" ]; then reports+=("$report"); else missing+=("$shard"); fi
        done
        {
          scripts/mutation/summarise.sh "Mutation score — src/Motiv (all shards)" "${reports[@]}"
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '\n**Incomplete:** no report from %s. The score above covers the other shards only.\n' "${missing[*]}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
